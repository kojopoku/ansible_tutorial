---


- name: My first ansible playbook
  hosts: all
  become: yes
 


  tasks:
  - name: install apache (httpd) and php packages
    ansible.builtin.dnf:
      name: 
        - httpd
        - php
      state: latest
      update_cache: yes
    when: ansible_facts['os_family'] == "RedHat"



  - name: install apache2 and libapache2-mod-php
    ansible.builtin.apt:
      name: 
        - apache2
        - libapache2-mod-php
      state: latest
      update_cache: yes
    when: ansible_facts['os_family'] == "Debian"
