---

- name: playbook to demonstrate how to remove a package from hosts
  hosts: all
  become: yes


  tasks:
    - name: remove apache from the hosts servers
      ansible.builtin.dnf:
        name: httpd
        state: absent
      when: ansible_facts['os_family'] == "RedHat"

    - name: remove php from the hosts servers
      ansible.builtin.dnf:
        name: php
        state: absent
      when: ansible_facts['os_family'] == "RedHat"


    - name: remove apache2
      ansible.builtin.apt:
        name: apache2
        state: absent
      when: ansible_facts['os_family'] == "Debian"


    - name: remove libapache2-mod-php
      ansible.builtin.apt:
        name: libapache2-mod-php
        state: absent
      when: ansible_facts['os_family'] == "Debian"
